on: [push, pull_request]
name: CI
jobs:
  clippy_rustfmt:
    name: Lint & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - default
          - ssl-openssl
          - ssl-rustls
          - ssl-native-tls
    steps:
      - uses: actions/checkout@v2
      - name: Install pinned toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --features ${{ matrix.features }}

      - name: Format
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: -- --check

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.100.0
          - nightly
          - 1.57
        features:
          - default
          - ssl-openssl
          - ssl-rustls
          - ssl-native-tls
    steps:
      - uses: actions/checkout@v2
      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      # Explicit selection keeps the MSRV and nightly lanes independent of the root pin.
      - name: Build
        run: cargo +${{ matrix.rust }} build --features ${{ matrix.features }}

      - name: Test
        run: cargo +${{ matrix.rust }} test --features ${{ matrix.features }}
